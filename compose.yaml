services:
  booklens:
    build: .
    container_name: reader3-booklens
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 中设置 DEEPSEEK_API_KEY}
    volumes:
      - ./book:/app/book
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
